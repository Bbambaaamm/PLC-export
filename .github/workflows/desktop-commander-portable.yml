name: Desktop Commander portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-commander-portable.yml"
      - "desktop_commander/**"
      - "scripts/build_desktop_commander_portable.ps1"
      - "docs/DESKTOP_COMMANDER_PORTABLE.md"
  push:
    paths:
      - ".github/workflows/desktop-commander-portable.yml"
      - "desktop_commander/**"
      - "scripts/build_desktop_commander_portable.ps1"
      - "docs/DESKTOP_COMMANDER_PORTABLE.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Build portable Desktop Commander
        shell: pwsh
        run: ./scripts/build_desktop_commander_portable.ps1

      - name: Show bundle size
        shell: pwsh
        run: |
          Get-Item dist-desktop-commander\Desktop-Commander-Portable-win-x64.zip | Select-Object Name,Length
          Get-Content dist-desktop-commander\SHA256SUMS.txt

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Commander-Portable-win-x64
          path: |
            dist-desktop-commander/Desktop-Commander-Portable-win-x64.zip
            dist-desktop-commander/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish rolling Desktop Commander release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-commander-portable-latest --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete desktop-commander-portable-latest --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Existing Desktop Commander release could not be removed." }
          }
          gh release create desktop-commander-portable-latest --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Desktop Commander Portable - latest" --notes "Windows x64 portable balík bez instalace a bez admin práv. Stáhni Desktop-Commander-Portable-win-x64.zip a rozbal přímo na C:\. První OAuth proveď přes C:\desktop_commander\start.bat; pro běžný provoz potom používej C:\desktop_commander\start-hidden.vbs bez viditelného konzolového okna."
          if ($LASTEXITCODE -ne 0) { throw "Desktop Commander release creation failed." }
          gh release upload desktop-commander-portable-latest "dist-desktop-commander\Desktop-Commander-Portable-win-x64.zip" "dist-desktop-commander\SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Desktop Commander release upload failed." }
