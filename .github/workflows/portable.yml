name: Portable Windows bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/portable.yml"
      - "*.py"
      - "akl/**"
      - "dataExcelImport/**"
      - "gebhardt/**"
      - "ranpak/**"
      - "smartlog/**"
      - "teleskop/**"
      - "templates/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "portable/**"
      - "scripts/build_portable.ps1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/portable.yml"
      - "*.py"
      - "akl/**"
      - "dataExcelImport/**"
      - "gebhardt/**"
      - "ranpak/**"
      - "smartlog/**"
      - "teleskop/**"
      - "templates/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "portable/**"
      - "scripts/build_portable.ps1"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build minimal portable ZIP
        shell: pwsh
        run: ./scripts/build_portable.ps1

      - name: Show bundle size
        shell: pwsh
        run: |
          Get-Item dist\PLC-export-portable-win-x64.zip | Select-Object Name,Length
          Get-Content dist\SHA256SUMS.txt

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: PLC-export-portable-win-x64
          path: |
            dist/PLC-export-portable-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


      - name: Publish rolling portable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view portable-latest --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete portable-latest --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Existing portable-latest release could not be removed." }
          }
          gh release create portable-latest --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "PLC Exporter Portable - latest" --notes "Hotový Windows x64 balík bez instalace a bez admin práv. Stáhni PLC-export-portable-win-x64.zip, rozbal přímo na C:\ a spusť C:\plc_exporter\start-hidden.vbs. PLC Exporter i Prometheus poběží bez viditelných konzolových oken."
          if ($LASTEXITCODE -ne 0) { throw "portable-latest release creation failed." }
          gh release upload portable-latest "dist\PLC-export-portable-win-x64.zip" "dist\SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "portable-latest asset upload failed." }
