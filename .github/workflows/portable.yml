name: Portable Windows bundle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build minimal portable ZIP
        shell: pwsh
        run: ./scripts/build_portable.ps1

      - name: Show bundle size
        shell: pwsh
        run: |
          Get-Item dist\PLC-export-portable-win-x64.zip | Select-Object Name,Length
          Get-Content dist\SHA256SUMS.txt

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: PLC-export-portable-win-x64
          path: |
            dist/PLC-export-portable-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
